<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci pour votre commande !</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2f3542;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 60px;
            color: #2ed573;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            color: #747d8c;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-home {
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn-home:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">✅</div>
    <h1>Paiement réussi !</h1>
    <p>Merci pour votre commande au <strong>Snack 43</strong>. <br> Nous préparons votre sélection et elle arrive bientôt au gîte.</p>
    <a href="index.html" class="btn-home">Retour au menu</a>
</div>

</body>
</html>
